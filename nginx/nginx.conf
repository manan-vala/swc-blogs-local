# Design doc §10. TLS termination + routing to web/api + static media.
# Fill in the certificate paths for swc.iitg.ac.in before deploying.

events {}

http {
    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:4000;
    }

    server {
        listen 80;
        server_name swc.iitg.ac.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name swc.iitg.ac.in;

        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Media served straight off disk — bypasses Node entirely (§10).
        location /blogs/media/ {
            alias /var/www/media/;
        }

        # Next.js — required for streaming responses (§10).
        location /blogs/ {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Accel-Buffering no;
        }

        location /blogs/api/ {
            proxy_pass http://api_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
